[build]
  # Build the frontend (Next.js) and backend (TypeScript compile)
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Use Netlify's Next.js plugin for SSR support
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect all /api/* requests to the Netlify Function that wraps Express
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Functions configuration
[functions]
  node_bundler = "esbuild"
  included_files = ["backend/dist/**", "backend/prisma/**", "backend/node_modules/.prisma/**"]
